name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG || "";
            const expectedVersion = tag.startsWith("v") ? tag.slice(1) : tag;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const mod = JSON.parse(fs.readFileSync("src/module.json", "utf8"));

            console.log(`Release tag: ${tag}`);
            console.log(`package.json version: ${pkg.version}`);
            console.log(`src/module.json version: ${mod.version}`);

            if (!expectedVersion) {
              console.error("Error: Could not determine expected version from tag.");
              process.exit(1);
            }
            if (pkg.version !== expectedVersion) {
              console.error(`Error: package.json version (${pkg.version}) does not match tag (${tag})`);
              process.exit(1);
            }
            if (mod.version !== expectedVersion) {
              console.error(`Error: src/module.json version (${mod.version}) does not match tag (${tag})`);
              process.exit(1);
            }
            console.log("Version check passed!");
          '

      - name: Run verification
        run: |
          npm run test
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Build module
        run: npm run build

      - name: Create module.zip
        working-directory: dist
        run: zip -r ../module.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/module.json
            module.zip
          generate_release_notes: true
